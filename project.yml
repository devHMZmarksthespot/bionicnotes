name: BionicNotes
options:
  bundleIdPrefix: hmzinnovation
  deploymentTarget:
    iOS: "27.3"          # Pencil auf dem iPhone Duo ab 27.2, Ziel-Release 27.3
    watchOS: "27.3"
  createIntermediateGroups: true
  developmentLanguage: de             # Siri-Sätze der App Intents sind auf Deutsch
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: CA9847D4GK
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BionicNotes:
    type: application
    platform: iOS
    scheme: {}                        # feste Schemes, statt sie von Xcode automatisch erzeugen zu lassen
    sources:
      - BionicNotes
      - Shared                          # gemeinsam mit der Watch-App
    dependencies:
      - target: BionicNotesWatch      # Watch-App wird ins iPhone-App-Bundle eingebettet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hmzinnovation.bionicnotes
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: BionicNotes/Info.plist
      properties:
        CFBundleDisplayName: BionicNotes
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "BionicNotes nimmt Vorträge auf, damit du sie später anhören und transkribieren kannst."
        NSCameraUsageDescription: "BionicNotes fotografiert Folien und Momente eines Vortrags und legt sie an die passende Stelle der Aufnahme."
        NSSpeechRecognitionUsageDescription: "BionicNotes transkribiert Vorträge direkt auf dem Gerät – nichts verlässt dein iPhone."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]

  BionicNotesWatch:
    type: application
    platform: watchOS
    scheme: {}
    sources:
      - BionicNotesWatch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hmzinnovation.bionicnotes.watchkitapp
        PRODUCT_NAME: BionicNotes
        SKIP_INSTALL: YES
    info:
      path: BionicNotesWatch/Info.plist
      properties:
        CFBundleDisplayName: BionicNotes
        WKApplication: true
        WKCompanionAppBundleIdentifier: hmzinnovation.bionicnotes
